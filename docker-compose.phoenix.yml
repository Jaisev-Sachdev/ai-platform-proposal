version: "3.9"

# =============================================================================
# Venti AI Platform -- Phoenix Observability Stack + LiteLLM Proxy
#
# Runs three services:
#   - Arize Phoenix: LLM tracing and evaluation UI
#   - PostgreSQL: persistent storage for Phoenix traces
#   - LiteLLM proxy: intercepts all AI calls from any tool (Claude Code, etc.)
#     and forwards traces to Phoenix automatically
#
# Usage:
#   docker compose -f docker-compose.phoenix.yml up -d
#
# Ports exposed:
#   6006  -- Phoenix web UI          (http://localhost:6006)
#   4317  -- OTLP gRPC collector     (used by LiteLLM and instrumented code)
#   4318  -- OTLP HTTP collector     (alternative to gRPC)
#   4000  -- LiteLLM proxy           (http://localhost:4000)
#            Point Claude Code here instead of api.anthropic.com
#            to get automatic tracing of all AI calls into Phoenix.
#
# All trace data stays on this machine. Nothing is sent to Arize servers.
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL -- persistent storage for Phoenix traces, datasets, experiments.
  # Using a dedicated instance to avoid conflicts with Multica's database.
  # ---------------------------------------------------------------------------
  phoenix-db:
    image: postgres:16
    container_name: phoenix-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: phoenix
      POSTGRES_PASSWORD: ${PHOENIX_DB_PASSWORD:-phoenix}
      POSTGRES_DB: phoenix
    volumes:
      - phoenix_db_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"   # Exposed on 5433 to avoid conflict with Multica's postgres on 5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phoenix -d phoenix"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - phoenix-net

  # ---------------------------------------------------------------------------
  # Phoenix -- AI observability platform.
  # Collects OpenTelemetry traces from LiteLLM and instrumented code.
  # Provides UI for trace inspection, evaluations, and prompt experiments.
  # ---------------------------------------------------------------------------
  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: phoenix
    restart: unless-stopped
    depends_on:
      phoenix-db:
        condition: service_healthy
    environment:
      PHOENIX_SQL_DATABASE_URL: postgresql://phoenix:${PHOENIX_DB_PASSWORD:-phoenix}@phoenix-db:5432/phoenix
      PHOENIX_ENABLE_AUTH: ${PHOENIX_ENABLE_AUTH:-false}
      PHOENIX_SECRET: ${PHOENIX_SECRET:-local-dev-secret-change-for-production}
      PHOENIX_TELEMETRY_ENABLED: "false"
    ports:
      - "6006:6006"   # Web UI
      - "4317:4317"   # OTLP gRPC (primary ingest endpoint)
      - "4318:4318"   # OTLP HTTP (alternative ingest endpoint)
    volumes:
      - phoenix_data:/phoenix
    networks:
      - phoenix-net

  # ---------------------------------------------------------------------------
  # LiteLLM proxy -- the bridge between Claude Code (and any other AI CLI tool)
  # and Phoenix.
  #
  # How it works:
  #   Claude Code is pointed at http://localhost:4000 instead of api.anthropic.com.
  #   LiteLLM forwards every request to Anthropic, then automatically sends a
  #   trace of that call to Phoenix via OTLP. This captures ALL AI calls from
  #   ALL tools on this machine -- not just Python SDK calls.
  #
  # The master_key (sk-venti-local) is a local access token engineers use to
  # authenticate with the proxy. It is not an Anthropic key. In a team deployment,
  # each engineer gets their own virtual key generated from this master key,
  # enabling per-engineer usage tracking.
  # ---------------------------------------------------------------------------
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: litellm
    restart: unless-stopped
    depends_on:
      phoenix:
        condition: service_started
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      PHOENIX_COLLECTOR_ENDPOINT: "http://phoenix:4317"
      PHOENIX_PROJECT_NAME: ${PHOENIX_PROJECT_NAME:-venti-claude-code}
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://phoenix:4317"
      STORE_MODEL_IN_DB: "false"
    volumes:
      - ./litellm/config.yaml:/app/config.yaml
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    ports:
      - "4000:4000"   # Proxy endpoint -- point Claude Code here
    networks:
      - phoenix-net

volumes:
  phoenix_db_data:
    driver: local
  phoenix_data:
    driver: local

networks:
  phoenix-net:
    driver: bridge

