      model: anthropic/claude-sonnet-4-6
      api_key: os.environ/ANTHROPIC_API_KEY

litellm_settings:
  callbacks: ["arize_phoenix"]
  drop_params: true
  modify_params: true

general_settings:
  master_key: "sk-venti-local"
  disable_key_check: true
